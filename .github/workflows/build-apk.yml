name: Build Shadow AI APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # PYTHON
      # ----------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ----------------------------------------------------
      # ANDROID / BUILD DEPENDENCIES
      # ----------------------------------------------------

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libsqlite3-dev \
            libltdl-dev

      # ----------------------------------------------------
      # PYTHON BUILD TOOLS
      # ----------------------------------------------------

      - name: Install Buildozer and dependencies
        run: |

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            python-for-android==2026.5.9 \
            cython==0.29.33 \
            kivy==2.3.0 \
            certifi \
            requests

      # ----------------------------------------------------
      # BUILD APK
      # ----------------------------------------------------

      - name: Build Android APK
        working-directory: frontend
        run: |

          yes | buildozer android debug

      # ----------------------------------------------------
      # VERIFY APK EXISTS
      # ----------------------------------------------------

      - name: Check APK
        working-directory: frontend
        run: |

          echo "Generated APK files:"

          ls -lah bin/

          test -n "$(find bin -name '*.apk' -print -quit)"

      # ----------------------------------------------------
      # UPLOAD
      # ----------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4

        with:
          name: shadow-ai-debug-apk

          path: frontend/bin/*.apk

          if-no-files-found: error
